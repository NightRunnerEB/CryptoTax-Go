name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    env:
      GOWORK: off
    strategy:
      fail-fast: false
      matrix:
        module:
          - gen
          - pkg
          - services/price-svc
          - services/aggregation-svc
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.work
          cache: true

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/cmd/golangci-lint@v1.64.0

      - name: GolangCI-Lint
        working-directory: ${{ matrix.module }}
        run: $(go env GOPATH)/bin/golangci-lint run ./... --timeout=5m

  test:
    runs-on: ubuntu-latest
    env:
      GOWORK: off
    strategy:
      fail-fast: false
      matrix:
        module:
          - gen
          - pkg
          - services/price-svc
          - services/aggregation-svc
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.work
          cache: true

      - name: Test
        working-directory: ${{ matrix.module }}
        run: go test ./...

  build:
    runs-on: ubuntu-latest
    env:
      GOWORK: off
    strategy:
      fail-fast: false
      matrix:
        module:
          - gen
          - pkg
          - services/price-svc
          - services/aggregation-svc
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.work
          cache: true

      - name: Build
        working-directory: ${{ matrix.module }}
        run: go build ./...
