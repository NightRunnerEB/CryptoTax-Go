syntax = "proto3";

package aggregation.v1;

option go_package = "github.com/NightRunner/CryptoTax-Go/gen/aggregation/v1;aggregationv1";

import "google/api/annotations.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

// Aggregation provides read-model APIs for aggregated transactions
// and user-level aggregation settings.
service Aggregation {
  // ListTransactions returns aggregated transactions for the authenticated user
  // with cursor-based pagination and optional server-side filters.
  rpc ListTransactions(ListTransactionsRequest)
  returns (ListTransactionsResponse) {
    option (google.api.http) = {
      get: "/transactions"
    };
  }

  // ListTransactionsByRange returns paginated aggregated transactions
  // for a specific user and UTC time range [from_utc, to_utc).
  rpc ListTransactionsByRange(ListTransactionsByRangeRequest)
  returns (ListTransactionsByRangeResponse) {
    option (google.api.http) = {
      get: "/v1/users/{user_id}/transactions"
    };
  }

  // GetUserSettings returns aggregation settings for the authenticated user.
  rpc GetUserSettings(GetUserSettingsRequest)
  returns (GetUserSettingsResponse) {
    option (google.api.http) = {
      get: "/settings"
    };
  }

  // UpsertUserSettings creates or updates aggregation settings for the authenticated user.
  rpc UpsertUserSettings(UpsertUserSettingsRequest)
  returns (UpsertUserSettingsResponse) {
    option (google.api.http) = {
      put: "/settings"
      body: "*"
    };
  }

  // ListSupportedFiatCurrencies returns fiat codes supported by valuation pipeline.
  rpc ListSupportedFiatCurrencies(ListSupportedFiatCurrenciesRequest)
  returns (ListSupportedFiatCurrenciesResponse) {
    option (google.api.http) = {
      get: "/fiat-currencies"
    };
  }
}

message AggregatedTx {
  string                    tx_id           = 1;
  string                    user_id       = 2;
  string                    source          = 4;
  string                    import_id       = 5;
  google.protobuf.Timestamp time_utc        = 6;
  string                    kind            = 7;
  google.protobuf.Struct    in_money        = 8;
  google.protobuf.Struct    out_money       = 9;
  google.protobuf.Struct    fee_money       = 10;
  optional string           tx_hash         = 11;
  string                    note            = 12;
  optional string           contract_symbol = 13;
  string                    derivative_kind = 14;
  optional string           position_id     = 15;
  optional string           order_id        = 16;
  string                    tx_fingerprint  = 17;
}

message ListTransactionsRequest {
  // Optional lower time bound (inclusive), UTC.
  google.protobuf.Timestamp date_from = 1;
  // Optional upper time bound (exclusive), UTC.
  google.protobuf.Timestamp date_to = 2;
  // Optional import filter.
  string import_id = 3;
  // Optional source filter.
  string source = 4;
  // Optional transaction kind filter.
  string kind = 5;
  // Cursor-based page size.
  int32 page_size = 6;
  // Cursor token from previous page.
  string page_token = 7;
  // Optional fiat override for on-the-fly revaluation.
  string target_fiat = 8;
}

message ListTransactionsResponse {
  repeated AggregatedTx items = 1;
  string next_page_token = 2;
}

message ListTransactionsByRangeRequest {
  string                    user_id = 1;
  google.protobuf.Timestamp from_utc  = 2;
  google.protobuf.Timestamp to_utc    = 3;
  int32                     limit     = 4;
  int32                     offset    = 5;
  // Optional fiat override used by tax-svc.
  // When set, aggregation-svc re-valuates legs to this fiat on the fly
  // and does not mutate stored read-model data.
  string                    target_fiat = 6;
}

message ListTransactionsByRangeResponse {
  repeated AggregatedTx transactions = 1;
  int64                 total        = 2;
}

message UserSettings {
  string user_id     = 1;
  string fiat_currency = 2;
  string timezone      = 3;
}

message GetUserSettingsRequest {
  string user_id = 1;
}

message GetUserSettingsResponse {
  UserSettings settings = 1;
}

message UpsertUserSettingsRequest {
  string user_id     = 1;
  string fiat_currency = 2;
  string timezone      = 3;
}

message UpsertUserSettingsResponse {
  UserSettings settings = 1;
}

message SupportedFiatCurrency {
  string code = 1;
  string display_name = 2;
}

message ListSupportedFiatCurrenciesRequest {}

message ListSupportedFiatCurrenciesResponse {
  repeated SupportedFiatCurrency currencies = 1;
}
