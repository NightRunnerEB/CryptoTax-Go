syntax = "proto3";

package price.v1;

option go_package = "github.com/NightRunner/CryptoTax-Go/gen/price/v1;pricev1";

import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";

// Price provides transaction valuation APIs and user symbol mapping APIs.
service Price {
  // Valuates batch of transactions and returns calculated prices.
  rpc ValuateTransactionsBatch(ValuateTransactionsRequest)
  returns (ValuateTransactionsResponse) {
    option (google.api.http) = {
      post: "/v1/price/transactions:valuate"
      body: "*"
    };
  }

  // Creates or updates user symbol.
  rpc UpsertUserSymbol(UpsertUserSymbolRequest)
  returns (UpsertUserSymbolResponse) {
    option (google.api.http) = {
      put: "/v1/price/user-symbols"
      body: "*"
    };
  }
}

message MoneyLeg {
  string symbol = 1;
  string amount = 2; // decimal as string
}

message FiatLeg {
  string              fiat  = 1; // decimal as string
  optional AssetError error = 2;
}

message TxToValuate {
  string                    tx_id     = 1;
  google.protobuf.Timestamp time_utc  = 2;
  optional MoneyLeg         in_money  = 3;
  optional MoneyLeg         out_money = 4;
  optional MoneyLeg         fee_money = 5;
}

enum AssetErrorCode {
  ASSET_UNKNOWN   = 0;
  ASSET_AMBIGUOUS = 1;
  RATE_NOT_FOUND  = 2;
  PROVIDER_ERROR  = 3;
}

message CoinCandidate {
  string coin_id = 1;
  string name    = 2;
}

message AssetError {
  string                 symbol     = 1;
  AssetErrorCode         code       = 2;
  repeated CoinCandidate candidates = 4;
}

message ValuatedTx {
  string           tx_id    = 1;
  optional FiatLeg in_fiat  = 2;
  optional FiatLeg out_fiat = 3;
  optional FiatLeg fee_fiat = 4;
}

message ValuateTransactionsRequest {
  string               user_id     = 1;
  string               source        = 2;
  string               fiat_currency = 3;
  repeated TxToValuate transactions  = 4;
}

message ValuateTransactionsResponse {
  repeated ValuatedTx transactions = 1;
}

message UpsertUserSymbolRequest {
  string user_id = 1;
  string source    = 2;
  string symbol    = 3;
  string coin_id   = 4;
}

message UpsertUserSymbolResponse {}
