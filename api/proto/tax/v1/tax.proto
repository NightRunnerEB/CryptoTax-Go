syntax = "proto3";

package tax.v1;

option go_package = "github.com/NightRunner/CryptoTax-Go/gen/tax/v1;taxv1";

import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";

// Tax provides tax profile management and asynchronous tax job APIs.
service Tax {
  // GetTaxProfile returns the tax profile for the authenticated user.
  rpc GetTaxProfile(GetTaxProfileRequest) returns (GetTaxProfileResponse) {
    option (google.api.http) = {
      get: "/tax/profile"
    };
  }

  // UpsertTaxProfile creates or updates the authenticated user's tax profile.
  rpc UpsertTaxProfile(UpsertTaxProfileRequest) returns (UpsertTaxProfileResponse) {
    option (google.api.http) = {
      put: "/tax/profile"
      body: "profile"
    };
  }

  // StartReport enqueues a tax calculation job.
  rpc StartReport(StartReportRequest) returns (StartReportResponse) {
    option (google.api.http) = {
      post: "/tax/reports:start"
      body: "params"
    };
  }

  // GetReportStatus returns one tax job by report_id.
  rpc GetReportStatus(GetReportStatusRequest) returns (GetReportStatusResponse) {
    option (google.api.http) = {
      get: "/tax/reports/{report_id}"
    };
  }

  // ListReports returns paginated tax jobs for the authenticated user.
  rpc ListReports(ListReportsRequest) returns (ListReportsResponse) {
    option (google.api.http) = {
      get: "/tax/reports"
    };
  }
}

message TaxPolicy {
  bool treat_crypto_crypto_as_disposal = 1;
  string cost_basis_method = 2;
  string jurisdiction = 3;
}

message TaxProfile {
  string user_id = 1;
  string inn = 2;
  string last_name = 3;
  string first_name = 4;
  string middle_name = 5;
  reserved 7;
  reserved "jurisdiction";
  string timezone = 8;
  string phone = 9;
  repeated string wallets = 10;
  string tax_residency_status = 11;
  string taxpayer_type = 12;
}

message TaxProfileInput {
  string inn = 1;
  string last_name = 2;
  string first_name = 3;
  string middle_name = 4;
  reserved 5;
  reserved "jurisdiction";
  string timezone = 6;
  string phone = 7;
  repeated string wallets = 8;
  string tax_residency_status = 9;
  string taxpayer_type = 10;
}

message TaxSummary {
  string total_income_fiat = 1;
  string total_expense_fiat = 2;
  string tax_base_fiat = 3;
  string tax_due_fiat = 4;
}

message TaxJob {
  string report_id = 1;
  string user_id = 2;
  int32 tax_year = 3;
  TaxPolicy policy_snapshot = 4;
  string status = 5;
  int32 attempts = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp started_at = 8;
  google.protobuf.Timestamp finished_at = 9;
  string last_error_code = 10;
  string last_error_message = 11;
  string audit_zip_url = 12;
  string report_url = 13;
  TaxSummary summary = 14;
}

message GetTaxProfileRequest {
  string user_id = 1;
}

message GetTaxProfileResponse {
  TaxProfile profile = 1;
}

message UpsertTaxProfileRequest {
  string user_id = 1;
  TaxProfileInput profile = 2;
}

message UpsertTaxProfileResponse {
  TaxProfile profile = 1;
}

message StartReportParams {
  int32 tax_year = 1;
  TaxPolicy tax_policy = 2;
}

message StartReportRequest {
  string user_id = 1;
  StartReportParams params = 2;
}

message StartReportResponse {
  string report_id = 1;
  string status = 2;
}

message GetReportStatusRequest {
  string user_id = 1;
  string report_id = 2;
}

message GetReportStatusResponse {
  TaxJob job = 1;
}

message ListReportsRequest {
  string user_id = 1;
  int32 limit = 2;
  int32 offset = 3;
}

message ListReportsResponse {
  repeated TaxJob jobs = 1;
  int64 total = 2;
}
