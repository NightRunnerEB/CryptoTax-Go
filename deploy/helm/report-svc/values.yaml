replicaCount: 1

strategy:
  maxUnavailable: 0
  maxSurge: 1

image:
  repository: cryptotax/report-svc
  tag: dev
  pullPolicy: Never

service:
  type: ClusterIP
  port: 8098
  targetPort: 8098

probes:
  startup:
    enabled: true
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 30
  readiness:
    enabled: true
    initialDelaySeconds: 8
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3
  liveness:
    enabled: true
    initialDelaySeconds: 20
    periodSeconds: 15
    timeoutSeconds: 3
    failureThreshold: 3

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

podSecurityContext:
  enabled: true
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  fsGroupChangePolicy: OnRootMismatch

containerSecurityContext:
  enabled: true
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

secrets:
  name: report-svc-secrets

externalSecret:
  enabled: true
  name: report-svc-externalsecret
  refreshInterval: 1m
  secretStoreRef:
    name: vault-backend
    kind: SecretStore
  target:
    creationPolicy: Owner
    deletionPolicy: Retain
  vault:
    key: cryptotax/report-svc
  data:
    - secretKey: APP_VERSION
      property: APP_VERSION
    - secretKey: APP_ENV
      property: APP_ENV
    - secretKey: MINIO_ENDPOINT
      property: MINIO_ENDPOINT
    - secretKey: MINIO_ACCESS_KEY
      property: MINIO_ACCESS_KEY
    - secretKey: MINIO_SECRET_KEY
      property: MINIO_SECRET_KEY
    - secretKey: OTEL_EXPORTER_OTLP_ENDPOINT
      property: OTEL_EXPORTER_OTLP_ENDPOINT
    - secretKey: OTEL_EXPORTER_OTLP_INSECURE
      property: OTEL_EXPORTER_OTLP_INSECURE
