apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: auth-svc-allow
  namespace: cryptotax
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: auth-svc
  action: ALLOW
  rules:
    - from:
        - source:
            namespaces: ["cryptotax"]
      to:
        - operation:
            ports: ["8085"]
    - from:
        - source:
            namespaces: ["istio-system"]
      to:
        - operation:
            ports: ["8085"]
            methods: ["POST"]
            paths: ["/auth/register", "/auth/login", "/auth/refresh"]
        - operation:
            ports: ["8085"]
            methods: ["GET"]
            paths: ["/auth/verify", "/.well-known/jwks.json", "/health"]
    - from:
        - source:
            namespaces: ["istio-system"]
      to:
        - operation:
            ports: ["8085"]
      when:
        - key: request.headers[x-user-id]
          values: ["*"]
        - key: request.headers[x-role]
          values: ["*"]
---
