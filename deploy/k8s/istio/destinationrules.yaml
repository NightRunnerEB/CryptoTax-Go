apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  name: auth-svc
  namespace: cryptotax
spec:
  host: auth-svc.cryptotax.svc.cluster.local
  trafficPolicy:
    tls:
      mode: ISTIO_MUTUAL # клиент и сервер будут использовать mTLS для шифрования трафика между собой
    loadBalancer:
      simple: LEAST_REQUEST
---
