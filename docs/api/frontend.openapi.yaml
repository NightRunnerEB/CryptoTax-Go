openapi: 3.1.0
info:
  title: CryptoTax Frontend REST API
  version: 1.0.0
  description: |
    Frontend-facing REST API exposed through grpc-gateway behind Nginx.
    Authenticated user-facing endpoints derive identity context on the backend from validated auth data.
servers:
  - url: https://api.cryptotax.example.com
    description: Production
  - url: http://localhost:8080
    description: Local gateway
security:
  - bearerAuth: []
tags:
  - name: Aggregation
    description: Read-model transactions and aggregation settings for UI.
  - name: Tax
    description: Tax profile and tax report job lifecycle.
  - name: Auth
    description: User auth flows from auth-svc.
  - name: Ledger
    description: Import upload endpoints from ledger-svc.
paths:
  /auth/register:
    post:
      tags: [Auth]
      operationId: authRegister
      summary: Register user
      servers:
        - url: https://auth.cryptotax.example.com
          description: Auth service production
        - url: http://localhost:8082
          description: Local auth-svc
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterReq'
      responses:
        '200':
          description: Registration accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AckResponse'
        '409':
          $ref: '#/components/responses/AuthConflict'
        '422':
          $ref: '#/components/responses/AuthUnprocessable'
        '502':
          $ref: '#/components/responses/AuthBadGateway'
        '503':
          $ref: '#/components/responses/AuthUnavailable'
        '500':
          $ref: '#/components/responses/AuthInternal'

  /auth/login:
    post:
      tags: [Auth]
      operationId: authLogin
      summary: Login and create session
      servers:
        - url: https://auth.cryptotax.example.com
          description: Auth service production
        - url: http://localhost:8082
          description: Local auth-svc
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginReq'
      responses:
        '200':
          description: Login result with user, session and tokens
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResult'
        '401':
          $ref: '#/components/responses/AuthUnauthorized'
        '403':
          $ref: '#/components/responses/AuthForbidden'
        '422':
          $ref: '#/components/responses/AuthUnprocessable'
        '500':
          $ref: '#/components/responses/AuthInternal'

  /auth/refresh:
    post:
      tags: [Auth]
      operationId: authRefresh
      summary: Rotate refresh token and issue new tokens
      servers:
        - url: https://auth.cryptotax.example.com
          description: Auth service production
        - url: http://localhost:8082
          description: Local auth-svc
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshReq'
      responses:
        '200':
          description: New token pair
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tokens'
        '401':
          $ref: '#/components/responses/AuthUnauthorized'
        '500':
          $ref: '#/components/responses/AuthInternal'

  /auth/logout:
    post:
      tags: [Auth]
      operationId: authLogout
      summary: Logout by access token
      servers:
        - url: https://auth.cryptotax.example.com
          description: Auth service production
        - url: http://localhost:8082
          description: Local auth-svc
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Logout completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AckResponse'
        '401':
          $ref: '#/components/responses/AuthUnauthorized'
        '500':
          $ref: '#/components/responses/AuthInternal'

  /auth/verify:
    get:
      tags: [Auth]
      operationId: authVerifyEmail
      summary: Verify email by one-time token
      servers:
        - url: https://auth.cryptotax.example.com
          description: Auth service production
        - url: http://localhost:8082
          description: Local auth-svc
      parameters:
        - name: token
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Email verified
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AckResponse'
        '401':
          $ref: '#/components/responses/AuthUnauthorized'
        '500':
          $ref: '#/components/responses/AuthInternal'

  /mexc/csv:
    post:
      tags: [Ledger]
      operationId: uploadMexcCsv
      summary: Upload and parse MEXC CSV
      servers:
        - url: https://ledger.cryptotax.example.com
          description: Ledger service production
        - url: http://localhost:8086
          description: Local ledger-svc
      parameters:
        - name: X-User-Id
          in: header
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
              required: [file]
      responses:
        '200':
          description: CSV parsed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParseSuccessResponse'
        '400':
          $ref: '#/components/responses/LedgerBadRequest'
        '403':
          $ref: '#/components/responses/LedgerForbidden'
        '404':
          $ref: '#/components/responses/LedgerNotFound'
        '422':
          $ref: '#/components/responses/LedgerUnprocessable'
        '500':
          $ref: '#/components/responses/LedgerInternal'
        '503':
          $ref: '#/components/responses/LedgerUnavailable'

  /exchanges/supported:
    get:
      tags: [Ledger]
      operationId: listSupportedExchanges
      summary: List supported exchanges
      servers:
        - url: https://ledger.cryptotax.example.com
          description: Ledger service production
        - url: http://localhost:8086
          description: Local ledger-svc
      responses:
        '200':
          description: Supported exchange IDs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupportedExchangesResponse'
        '500':
          $ref: '#/components/responses/LedgerInternal'

  /fiat-currencies:
    get:
      tags: [Aggregation]
      operationId: listSupportedFiatCurrencies
      summary: List supported fiat currencies
      description: Returns fiat currencies supported by aggregation/valuation pipeline.
      parameters:
        - $ref: '#/components/parameters/XTenantId'
        - $ref: '#/components/parameters/XUserId'
        - $ref: '#/components/parameters/XRoles'
      responses:
        '200':
          description: Supported currencies
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListSupportedFiatCurrenciesResponse'
        '400':
          $ref: '#/components/responses/GrpcInvalidArgument'
        '500':
          $ref: '#/components/responses/GrpcInternal'

  /imports/{import_id}/transactions:
    get:
      tags: [Aggregation]
      operationId: listTransactionsByImport
      summary: List aggregated transactions by import
      parameters:
        - $ref: '#/components/parameters/ImportIdPath'
        - $ref: '#/components/parameters/PaginationLimit'
        - $ref: '#/components/parameters/PaginationOffset'
      responses:
        '200':
          description: Paginated transactions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListTransactionsByImportResponse'
        '400':
          $ref: '#/components/responses/GrpcInvalidArgument'
        '500':
          $ref: '#/components/responses/GrpcInternal'

  /settings:
    get:
      tags: [Aggregation]
      operationId: getTenantSettings
      summary: Get aggregation settings for the authenticated user
      parameters:
      responses:
        '200':
          description: Tenant settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetTenantSettingsResponse'
        '400':
          $ref: '#/components/responses/GrpcInvalidArgument'
        '500':
          $ref: '#/components/responses/GrpcInternal'
    put:
      tags: [Aggregation]
      operationId: upsertTenantSettings
      summary: Create or update aggregation settings for the authenticated user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpsertTenantSettingsBody'
      responses:
        '200':
          description: Upserted tenant settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpsertTenantSettingsResponse'
        '400':
          $ref: '#/components/responses/GrpcInvalidArgument'
        '500':
          $ref: '#/components/responses/GrpcInternal'

  /tax/profile:
    get:
      tags: [Tax]
      operationId: getTaxProfile
      summary: Get tax profile
      responses:
        '200':
          description: Tax profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetTaxProfileResponse'
        '400':
          $ref: '#/components/responses/GrpcInvalidArgument'
        '404':
          $ref: '#/components/responses/GrpcNotFound'
        '500':
          $ref: '#/components/responses/GrpcInternal'
    put:
      tags: [Tax]
      operationId: upsertTaxProfile
      summary: Create or update tax profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaxProfileInput'
      responses:
        '200':
          description: Upserted tax profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpsertTaxProfileResponse'
        '400':
          $ref: '#/components/responses/GrpcInvalidArgument'
        '500':
          $ref: '#/components/responses/GrpcInternal'

  /tax/reports:start:
    post:
      tags: [Tax]
      operationId: startReport
      summary: Start tax report job
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartReportParams'
      responses:
        '200':
          description: Tax job created and queued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StartReportResponse'
        '400':
          $ref: '#/components/responses/GrpcInvalidArgument'
        '404':
          $ref: '#/components/responses/GrpcNotFound'
        '500':
          $ref: '#/components/responses/GrpcInternal'

  /tax/reports/{report_id}:
    get:
      tags: [Tax]
      operationId: getReportStatus
      summary: Get tax report job status
      parameters:
        - $ref: '#/components/parameters/ReportIdPath'
      responses:
        '200':
          description: Tax report job
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetReportStatusResponse'
        '400':
          $ref: '#/components/responses/GrpcInvalidArgument'
        '404':
          $ref: '#/components/responses/GrpcNotFound'
        '500':
          $ref: '#/components/responses/GrpcInternal'

  /tax/reports:
    get:
      tags: [Tax]
      operationId: listReports
      summary: List tax report jobs
      parameters:
        - $ref: '#/components/parameters/PaginationLimit'
        - $ref: '#/components/parameters/PaginationOffset'
      responses:
        '200':
          description: Paginated report jobs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListReportsResponse'
        '400':
          $ref: '#/components/responses/GrpcInvalidArgument'
        '500':
          $ref: '#/components/responses/GrpcInternal'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    ImportIdPath:
      name: import_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ReportIdPath:
      name: report_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PaginationLimit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 200
    PaginationOffset:
      name: offset
      in: query
      required: false
      schema:
        type: integer
        format: int32
        minimum: 0
  responses:
    Error:
      description: Generic grpc-gateway error response.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    GrpcInvalidArgument:
      description: Invalid request data (gRPC `InvalidArgument`, code `3`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    GrpcFailedPrecondition:
      description: Request is valid but data is not ready (gRPC `FailedPrecondition`, code `9`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    GrpcNotFound:
      description: Resource not found (gRPC `NotFound`, code `5`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    GrpcConflict:
      description: Conflict/duplicate (gRPC `AlreadyExists` or `Aborted`, code `6`/`10`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    GrpcUnavailable:
      description: Temporary upstream/dependency outage (gRPC `Unavailable`, code `14`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    GrpcInternal:
      description: Internal server failure (gRPC `Internal`, code `13`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    AuthUnauthorized:
      description: Unauthorized (`TokenInvalid`, `TokenExpired`, `InvalidCredentials`, ...).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AuthErrorResponse'
    AuthForbidden:
      description: Forbidden (`UserNotVerified`, `UserBlocked`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AuthErrorResponse'
    AuthConflict:
      description: Conflict (`EmailAlreadyRegistered`, ...).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AuthErrorResponse'
    AuthUnprocessable:
      description: Validation error (`EmailInvalid`, `PasswordWeak`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AuthErrorResponse'
    AuthBadGateway:
      description: Upstream failure (`RegistrationFailed`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AuthErrorResponse'
    AuthUnavailable:
      description: Temporary outage (`EmailSendFailed`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AuthErrorResponse'
    AuthInternal:
      description: Internal server error (`Storage`, `Internal`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AuthErrorResponse'
    LedgerBadRequest:
      description: Bad request (missing file / malformed multipart / CSV format).
      content:
        application/json:
          schema:
            oneOf:
              - $ref: '#/components/schemas/SimpleErrorResponse'
              - $ref: '#/components/schemas/LedgerErrorResponse'
    LedgerForbidden:
      description: Missing/invalid tenant header or permission denied.
      content:
        application/json:
          schema:
            oneOf:
              - $ref: '#/components/schemas/SimpleErrorResponse'
              - $ref: '#/components/schemas/LedgerErrorResponse'
    LedgerNotFound:
      description: Exchange parser not configured.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SimpleErrorResponse'
    LedgerUnprocessable:
      description: Domain validation/consistency error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/LedgerErrorResponse'
    LedgerInternal:
      description: Internal server error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/LedgerErrorResponse'
    LedgerUnavailable:
      description: Dependency unavailable.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/LedgerErrorResponse'
  schemas:
    ErrorResponse:
      type: object
      description: Standard grpc-gateway error envelope.
      properties:
        code:
          type: integer
          format: int32
          description: gRPC status code (`3`, `5`, `9`, `13`, `14`, ...).
        message:
          type: string
          description: Human-readable error message.
        details:
          type: array
          description: Optional gRPC rich error details.
          items:
            oneOf:
              - $ref: '#/components/schemas/GrpcErrorInfoDetail'
              - $ref: '#/components/schemas/GrpcBadRequestDetail'
              - $ref: '#/components/schemas/GrpcResourceInfoDetail'
              - $ref: '#/components/schemas/GrpcAnyDetail'
      required: [code, message]
    GrpcErrorInfoDetail:
      type: object
      properties:
        '@type':
          type: string
          example: type.googleapis.com/google.rpc.ErrorInfo
        reason:
          type: string
          description: Stable machine-readable error reason (e.g. INVALID_ARGUMENT, DATA_NOT_READY).
        domain:
          type: string
          description: Service domain that produced the error.
        metadata:
          type: object
          additionalProperties:
            type: string
      required: ['@type', reason, domain]
    GrpcBadRequestDetail:
      type: object
      properties:
        '@type':
          type: string
          example: type.googleapis.com/google.rpc.BadRequest
        fieldViolations:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              description:
                type: string
            required: [field, description]
      required: ['@type', fieldViolations]
    GrpcResourceInfoDetail:
      type: object
      properties:
        '@type':
          type: string
          example: type.googleapis.com/google.rpc.ResourceInfo
        resourceType:
          type: string
        resourceName:
          type: string
      required: ['@type']
    GrpcAnyDetail:
      type: object
      description: Fallback for other google.rpc detail types.
      additionalProperties: true
    AuthErrorResponse:
      type: object
      properties:
        code:
          type: integer
          format: int32
        message:
          type: string
      required: [code, message]
    SimpleErrorResponse:
      type: object
      properties:
        error:
          type: string
      required: [error]
    LedgerErrorResponse:
      type: object
      properties:
        code:
          type: integer
          format: int32
        message:
          type: string
      required: [code, message]
    AckResponse:
      type: object
      properties:
        ok:
          type: boolean
      required: [ok]
    ParseSuccessResponse:
      type: object
      properties:
        status:
          type: string
      required: [status]
    SupportedExchangesResponse:
      type: object
      properties:
        exchanges:
          type: array
          items:
            type: string
          description: Sorted lowercase exchange identifiers from ledger registry.
          example: [mexc, okx]
      required: [exchanges]
    RegisterTaxProfile:
      type: object
      properties:
        inn:
          type: string
        last_name:
          type: string
        first_name:
          type: string
        middle_name:
          type: string
        jurisdiction:
          type: string
        timezone:
          type: string
        phone:
          type: string
        wallets:
          type: array
          items:
            type: string
        tax_residency_status:
          type: string
        taxpayer_type:
          type: string
      required:
        - inn
        - last_name
        - first_name
        - jurisdiction
        - timezone
        - tax_residency_status
        - taxpayer_type
    RegisterReq:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
        tax_profile:
          $ref: '#/components/schemas/RegisterTaxProfile'
      required: [email, password, tax_profile]
    LoginReq:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
        ip:
          type: string
          nullable: true
        ua:
          type: string
          nullable: true
      required: [email, password]
    RefreshReq:
      type: object
      properties:
        refresh_token:
          type: string
      required: [refresh_token]
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        status:
          type: string
          enum: [Active, Pending, Blocked]
        created_at:
          type: string
          format: date-time
      required: [id, email, status, created_at]
    Session:
      type: object
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [Active, Revoked, Closed]
        created_at:
          type: string
          format: date-time
        last_seen_at:
          type: string
          format: date-time
        ip:
          type: string
          nullable: true
        user_agent:
          type: string
          nullable: true
      required: [id, user_id, status, created_at, last_seen_at]
    Tokens:
      type: object
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        access_expires_in:
          type: integer
          format: int64
        refresh_expires_in:
          type: integer
          format: int64
      required: [access_token, refresh_token, access_expires_in, refresh_expires_in]
    LoginResult:
      type: object
      properties:
        user:
          $ref: '#/components/schemas/User'
        session:
          $ref: '#/components/schemas/Session'
        tokens:
          $ref: '#/components/schemas/Tokens'
      required: [user, session, tokens]

    SupportedFiatCurrency:
      type: object
      properties:
        code:
          type: string
          example: RUB
        displayName:
          type: string
          example: Russian Ruble
      required: [code, displayName]
    ListSupportedFiatCurrenciesResponse:
      type: object
      properties:
        currencies:
          type: array
          items:
            $ref: '#/components/schemas/SupportedFiatCurrency'
      required: [currencies]

    FiatLegErrorCandidate:
      type: object
      properties:
        coin_id:
          type: string
        name:
          type: string
    FiatLegError:
      type: object
      properties:
        code:
          type: string
        candidates:
          type: array
          items:
            $ref: '#/components/schemas/FiatLegErrorCandidate'
    MoneyLeg:
      type: object
      properties:
        symbol:
          type: string
        crypto_amount:
          type: string
        fiat_amount:
          type: string
        error:
          $ref: '#/components/schemas/FiatLegError'
      required: [symbol, crypto_amount]
      additionalProperties: true
    AggregatedTx:
      type: object
      properties:
        txId:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        source:
          type: string
        importId:
          type: string
          format: uuid
        timeUtc:
          type: string
          format: date-time
        kind:
          type: string
        inMoney:
          $ref: '#/components/schemas/MoneyLeg'
        outMoney:
          $ref: '#/components/schemas/MoneyLeg'
        feeMoney:
          $ref: '#/components/schemas/MoneyLeg'
        txHash:
          type: string
        note:
          type: string
        contractSymbol:
          type: string
        derivativeKind:
          type: string
        positionId:
          type: string
        orderId:
          type: string
        txFingerprint:
          type: string
      required:
        - txId
        - tenantId
        - source
        - importId
        - timeUtc
        - kind
        - note
        - derivativeKind
        - txFingerprint
    ListTransactionsByImportResponse:
      type: object
      properties:
        transactions:
          type: array
          items:
            $ref: '#/components/schemas/AggregatedTx'
        total:
          type: integer
          format: int64
      required: [transactions, total]

    TenantSettings:
      type: object
      properties:
        tenantId:
          type: string
          format: uuid
        fiatCurrency:
          type: string
          example: RUB
        timezone:
          type: string
          example: Europe/Moscow
      required: [tenantId, fiatCurrency, timezone]
    UpsertTenantSettingsBody:
      type: object
      properties:
        fiatCurrency:
          type: string
          description: Supported fiat code (e.g. USD, RUB, KZT).
        timezone:
          type: string
          description: IANA timezone.
      required: [fiatCurrency, timezone]
    GetTenantSettingsResponse:
      type: object
      properties:
        settings:
          $ref: '#/components/schemas/TenantSettings'
      required: [settings]
    UpsertTenantSettingsResponse:
      type: object
      properties:
        settings:
          $ref: '#/components/schemas/TenantSettings'
      required: [settings]

    TaxPolicy:
      type: object
      properties:
        treatCryptoCryptoAsDisposal:
          type: boolean
        costBasisMethod:
