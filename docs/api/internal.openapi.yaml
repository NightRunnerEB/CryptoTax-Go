openapi: 3.1.0
info:
  title: CryptoTax Internal REST API
  version: 1.0.0
  description: |
    Internal REST endpoints intended for in-cluster usage.
    Primary service-to-service contracts are gRPC; this spec documents
    internal REST routes exposed by grpc-gateway where applicable.
servers:
  - url: http://aggregation-svc:8095
    description: In-cluster gateway
  - url: http://localhost:8095
    description: Local aggregation gateway
security:
  - bearerAuth: []
    tenantHeader: []
tags:
  - name: AggregationInternal
    description: Internal aggregation read-model access for tax/report workflows.
  - name: LedgerInternal
    description: Internal ledger query endpoints used by other services.
  - name: AuthInternal
    description: Internal auth endpoints (Rust auth-svc).
paths:
  /v1/tenants/{tenant_id}/transactions:
    get:
      tags: [AggregationInternal]
      operationId: listTransactionsByRange
      summary: List aggregated transactions by UTC range
      description: |
        Internal read endpoint for tenant transactions in time range `[from_utc, to_utc)`.
        Supports optional `target_fiat` revaluation without mutating stored read-model.
      parameters:
        - $ref: '#/components/parameters/TenantIdPath'
        - $ref: '#/components/parameters/FromUtc'
        - $ref: '#/components/parameters/ToUtc'
        - $ref: '#/components/parameters/PaginationLimit'
        - $ref: '#/components/parameters/PaginationOffset'
        - $ref: '#/components/parameters/TargetFiat'
        - $ref: '#/components/parameters/XTenantId'
        - $ref: '#/components/parameters/XUserId'
        - $ref: '#/components/parameters/XRoles'
      responses:
        '200':
          description: Paginated transactions in range
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListTransactionsByRangeResponse'
        '400':
          $ref: '#/components/responses/GrpcInvalidArgumentOrPrecondition'
        '503':
          $ref: '#/components/responses/GrpcUnavailable'
        '500':
          $ref: '#/components/responses/GrpcInternal'

  /v1/tenants/{tenant_id}/imports/{import_id}/transactions:
    get:
      tags: [LedgerInternal]
      operationId: ledgerListImportTransactions
      summary: List ledger import transactions
      servers:
        - url: http://ledger-svc:8086
          description: In-cluster ledger-svc
        - url: http://localhost:8086
          description: Local ledger-svc
      parameters:
        - $ref: '#/components/parameters/TenantIdPath'
        - $ref: '#/components/parameters/ImportIdPath'
      responses:
        '200':
          description: Transactions for import
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  additionalProperties: true
        '400':
          $ref: '#/components/responses/LedgerBadRequest'
        '404':
          $ref: '#/components/responses/LedgerNotFound'
        '500':
          $ref: '#/components/responses/LedgerInternal'
        '503':
          $ref: '#/components/responses/LedgerUnavailable'

  /auth/register:
    post:
      tags: [AuthInternal]
      operationId: internalAuthRegister
      summary: Register user
      servers:
        - url: http://auth-svc:8082
          description: In-cluster auth-svc
        - url: http://localhost:8082
          description: Local auth-svc
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterReq'
      responses:
        '200':
          description: Registration accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AckResponse'
        '409':
          $ref: '#/components/responses/AuthConflict'
        '422':
          $ref: '#/components/responses/AuthUnprocessable'
        '502':
          $ref: '#/components/responses/AuthBadGateway'
        '503':
          $ref: '#/components/responses/AuthUnavailable'
        '500':
          $ref: '#/components/responses/AuthInternal'

  /auth/login:
    post:
      tags: [AuthInternal]
      operationId: internalAuthLogin
      summary: Login and create session
      servers:
        - url: http://auth-svc:8082
          description: In-cluster auth-svc
        - url: http://localhost:8082
          description: Local auth-svc
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginReq'
      responses:
        '200':
          description: Login result with user, session and tokens
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResult'
        '401':
          $ref: '#/components/responses/AuthUnauthorized'
        '403':
          $ref: '#/components/responses/AuthForbidden'
        '422':
          $ref: '#/components/responses/AuthUnprocessable'
        '500':
          $ref: '#/components/responses/AuthInternal'

  /auth/refresh:
    post:
      tags: [AuthInternal]
      operationId: internalAuthRefresh
      summary: Rotate refresh token and issue new tokens
      servers:
        - url: http://auth-svc:8082
          description: In-cluster auth-svc
        - url: http://localhost:8082
          description: Local auth-svc
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshReq'
      responses:
        '200':
          description: New token pair
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tokens'
        '401':
          $ref: '#/components/responses/AuthUnauthorized'
        '500':
          $ref: '#/components/responses/AuthInternal'

  /auth/logout:
    post:
      tags: [AuthInternal]
      operationId: internalAuthLogout
      summary: Logout by access token
      servers:
        - url: http://auth-svc:8082
          description: In-cluster auth-svc
        - url: http://localhost:8082
          description: Local auth-svc
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Logout completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AckResponse'
        '401':
          $ref: '#/components/responses/AuthUnauthorized'
        '500':
          $ref: '#/components/responses/AuthInternal'

  /auth/verify:
    get:
      tags: [AuthInternal]
      operationId: internalAuthVerifyEmail
      summary: Verify email by one-time token
      servers:
        - url: http://auth-svc:8082
          description: In-cluster auth-svc
        - url: http://localhost:8082
          description: Local auth-svc
      parameters:
        - name: token
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Email verified
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AckResponse'
        '401':
          $ref: '#/components/responses/AuthUnauthorized'
        '500':
          $ref: '#/components/responses/AuthInternal'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    tenantHeader:
      type: apiKey
      in: header
      name: X-Tenant-Id
  parameters:
    TenantIdPath:
      name: tenant_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ImportIdPath:
      name: import_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    FromUtc:
      name: from_utc
      in: query
      required: true
      schema:
        type: string
        format: date-time
      description: Inclusive UTC lower bound.
    ToUtc:
      name: to_utc
      in: query
      required: true
      schema:
        type: string
        format: date-time
      description: Exclusive UTC upper bound.
    PaginationLimit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 10000
    PaginationOffset:
      name: offset
      in: query
      required: false
      schema:
        type: integer
        format: int32
        minimum: 0
    TargetFiat:
      name: target_fiat
      in: query
      required: false
      schema:
        type: string
      description: Optional fiat override for on-the-fly revaluation (e.g. RUB, USD, KZT).
    XTenantId:
      name: X-Tenant-Id
      in: header
      required: true
      schema:
        type: string
        format: uuid
    XUserId:
      name: X-User-Id
      in: header
      required: false
      schema:
        type: string
        format: uuid
    XRoles:
      name: X-Roles
      in: header
      required: false
      schema:
        type: string
  responses:
    Error:
      description: Generic grpc-gateway error response.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    GrpcInvalidArgumentOrPrecondition:
      description: Invalid input or unresolved dependency data (gRPC `InvalidArgument`/`FailedPrecondition`, code `3`/`9`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    GrpcUnavailable:
      description: Temporary dependency outage (gRPC `Unavailable`, code `14`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    GrpcInternal:
      description: Internal server failure (gRPC `Internal`, code `13`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    LedgerBadRequest:
      description: Bad request (invalid UUID path params).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SimpleErrorResponse'
    LedgerNotFound:
      description: Import not found (or belongs to another tenant).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SimpleErrorResponse'
    LedgerInternal:
      description: Internal server error from ledger-svc.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/LedgerErrorResponse'
    LedgerUnavailable:
      description: Dependency unavailable.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/LedgerErrorResponse'
    AuthUnauthorized:
      description: Unauthorized (`TokenInvalid`, `TokenExpired`, `InvalidCredentials`, ...).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AuthErrorResponse'
    AuthForbidden:
      description: Forbidden (`UserNotVerified`, `UserBlocked`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AuthErrorResponse'
    AuthConflict:
      description: Conflict (`EmailAlreadyRegistered`, ...).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AuthErrorResponse'
    AuthUnprocessable:
      description: Validation error (`EmailInvalid`, `PasswordWeak`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AuthErrorResponse'
    AuthBadGateway:
      description: Upstream failure (`RegistrationFailed`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AuthErrorResponse'
    AuthUnavailable:
      description: Temporary outage (`EmailSendFailed`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AuthErrorResponse'
    AuthInternal:
      description: Internal server error (`Storage`, `Internal`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AuthErrorResponse'
  schemas:
    ErrorResponse:
      type: object
      description: Standard grpc-gateway error envelope.
      properties:
        code:
          type: integer
          format: int32
          description: gRPC status code (`3`, `9`, `13`, `14`, ...).
        message:
          type: string
          description: Human-readable error message.
        details:
          type: array
          description: Optional gRPC rich error details.
          items:
            oneOf:
              - $ref: '#/components/schemas/GrpcErrorInfoDetail'
              - $ref: '#/components/schemas/GrpcBadRequestDetail'
              - $ref: '#/components/schemas/GrpcResourceInfoDetail'
              - $ref: '#/components/schemas/GrpcAnyDetail'
      required: [code, message]
    GrpcErrorInfoDetail:
      type: object
      properties:
        '@type':
          type: string
          example: type.googleapis.com/google.rpc.ErrorInfo
        reason:
          type: string
        domain:
          type: string
        metadata:
          type: object
          additionalProperties:
            type: string
      required: ['@type', reason, domain]
    GrpcBadRequestDetail:
      type: object
      properties:
        '@type':
          type: string
          example: type.googleapis.com/google.rpc.BadRequest
        fieldViolations:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              description:
                type: string
            required: [field, description]
      required: ['@type', fieldViolations]
    GrpcResourceInfoDetail:
      type: object
      properties:
        '@type':
          type: string
          example: type.googleapis.com/google.rpc.ResourceInfo
        resourceType:
          type: string
        resourceName:
          type: string
      required: ['@type']
    GrpcAnyDetail:
      type: object
      description: Fallback for other google.rpc detail types.
      additionalProperties: true
    SimpleErrorResponse:
      type: object
      properties:
        error:
          type: string
      required: [error]
    LedgerErrorResponse:
      type: object
      properties:
        code:
          type: integer
          format: int32
        message:
          type: string
      required: [code, message]
    AuthErrorResponse:
      type: object
      properties:
        code:
          type: integer
          format: int32
        message:
          type: string
      required: [code, message]
    AckResponse:
      type: object
      properties:
        ok:
          type: boolean
      required: [ok]
    RegisterTaxProfile:
      type: object
      properties:
        inn:
          type: string
        last_name:
          type: string
        first_name:
          type: string
        middle_name:
          type: string
        jurisdiction:
          type: string
        timezone:
          type: string
        phone:
          type: string
        wallets:
          type: array
          items:
            type: string
        tax_residency_status:
          type: string
        taxpayer_type:
          type: string
      required:
        - inn
        - last_name
        - first_name
        - jurisdiction
        - timezone
        - tax_residency_status
        - taxpayer_type
    RegisterReq:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
        tax_profile:
          $ref: '#/components/schemas/RegisterTaxProfile'
      required: [email, password, tax_profile]
    LoginReq:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
        ip:
          type: string
          nullable: true
        ua:
          type: string
          nullable: true
      required: [email, password]
    RefreshReq:
      type: object
      properties:
        refresh_token:
          type: string
      required: [refresh_token]
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        status:
          type: string
          enum: [Active, Pending, Blocked]
        created_at:
          type: string
          format: date-time
      required: [id, email, status, created_at]
    Session:
      type: object
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [Active, Revoked, Closed]
        created_at:
          type: string
          format: date-time
        last_seen_at:
          type: string
          format: date-time
        ip:
          type: string
          nullable: true
        user_agent:
          type: string
          nullable: true
      required: [id, user_id, status, created_at, last_seen_at]
    Tokens:
      type: object
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        access_expires_in:
          type: integer
          format: int64
        refresh_expires_in:
          type: integer
          format: int64
      required: [access_token, refresh_token, access_expires_in, refresh_expires_in]
    LoginResult:
      type: object
      properties:
        user:
          $ref: '#/components/schemas/User'
        session:
          $ref: '#/components/schemas/Session'
        tokens:
          $ref: '#/components/schemas/Tokens'
      required: [user, session, tokens]

    FiatLegErrorCandidate:
      type: object
      properties:
        coin_id:
          type: string
        name:
          type: string
    FiatLegError:
      type: object
      properties:
        code:
          type: string
        candidates:
          type: array
          items:
            $ref: '#/components/schemas/FiatLegErrorCandidate'
    MoneyLeg:
      type: object
      properties:
        symbol:
          type: string
        crypto_amount:
          type: string
        fiat_amount:
          type: string
        error:
          $ref: '#/components/schemas/FiatLegError'
      required: [symbol, crypto_amount]
      additionalProperties: true
    AggregatedTx:
      type: object
      properties:
        txId:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        source:
          type: string
        importId:
          type: string
          format: uuid
        timeUtc:
          type: string
          format: date-time
        kind:
          type: string
        inMoney:
          $ref: '#/components/schemas/MoneyLeg'
        outMoney:
          $ref: '#/components/schemas/MoneyLeg'
        feeMoney:
          $ref: '#/components/schemas/MoneyLeg'
        txHash:
          type: string
        note:
          type: string
        contractSymbol:
          type: string
        derivativeKind:
          type: string
        positionId:
          type: string
        orderId:
          type: string
        txFingerprint:
          type: string
      required:
        - txId
        - tenantId
        - source
        - importId
        - timeUtc
        - kind
        - note
        - derivativeKind
        - txFingerprint
    ListTransactionsByRangeResponse:
      type: object
      properties:
        transactions:
          type: array
          items:
            $ref: '#/components/schemas/AggregatedTx'
        total:
          type: integer
          format: int64
      required: [transactions, total]
