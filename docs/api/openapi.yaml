openapi: 3.1.0
info:
  title: CryptoTax Unified REST API
  version: 1.0.0
  description: 'Unified OpenAPI spec containing both frontend-facing and internal
    in-cluster REST endpoints.

    Primary service-to-service contracts remain gRPC; REST routes are documented for
    testing and integration via Swagger.'
servers:
- url: https://api.cryptotax.example.com
  description: Production
- url: http://localhost:8080
  description: Local gateway
security:
- bearerAuth: []
tags:
- name: Aggregation
  description: Read-model transactions and aggregation settings for UI.
- name: Tax
  description: Tax profile and tax report job lifecycle.
- name: Auth
  description: User auth flows from auth-svc.
- name: Ledger
  description: Import upload endpoints from ledger-svc.
- name: AggregationInternal
  description: Internal aggregation read-model access for tax/report workflows.
- name: PriceInternal
  description: Internal valuation and user symbol APIs from price-svc.
- name: ReportInternal
  description: Internal report rendering APIs from report-svc.
- name: LedgerInternal
  description: Internal ledger query endpoints used by other services.
- name: AuthInternal
  description: Internal auth endpoints (Rust auth-svc).
paths:
  /auth/register:
    post:
      tags:
      - Auth
      operationId: authRegister
      summary: Register user
      servers:
      - url: https://auth.cryptotax.example.com
        description: Auth service production
      - url: http://localhost:8082
        description: Local auth-svc
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterReq'
      responses:
        '200':
          description: Registration accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AckResponse'
        '409':
          $ref: '#/components/responses/AuthConflict'
        '422':
          $ref: '#/components/responses/AuthUnprocessable'
        '502':
          $ref: '#/components/responses/AuthBadGateway'
        '503':
          $ref: '#/components/responses/AuthUnavailable'
        '500':
          $ref: '#/components/responses/AuthInternal'
  /auth/login:
    post:
      tags:
      - Auth
      operationId: authLogin
      summary: Login and create session
      servers:
      - url: https://auth.cryptotax.example.com
        description: Auth service production
      - url: http://localhost:8082
        description: Local auth-svc
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginReq'
      responses:
        '200':
          description: Login result with user, session and tokens
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResult'
        '401':
          $ref: '#/components/responses/AuthUnauthorized'
        '403':
          $ref: '#/components/responses/AuthForbidden'
        '422':
          $ref: '#/components/responses/AuthUnprocessable'
        '500':
          $ref: '#/components/responses/AuthInternal'
  /auth/refresh:
    post:
      tags:
      - Auth
      operationId: authRefresh
      summary: Rotate refresh token and issue new tokens
      servers:
      - url: https://auth.cryptotax.example.com
        description: Auth service production
      - url: http://localhost:8082
        description: Local auth-svc
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshReq'
      responses:
        '200':
          description: New token pair
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tokens'
        '401':
          $ref: '#/components/responses/AuthUnauthorized'
        '500':
          $ref: '#/components/responses/AuthInternal'
  /auth/logout:
    post:
      tags:
      - Auth
      operationId: authLogout
      summary: Logout by access token
      servers:
      - url: https://auth.cryptotax.example.com
        description: Auth service production
      - url: http://localhost:8082
        description: Local auth-svc
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Logout completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AckResponse'
        '401':
          $ref: '#/components/responses/AuthUnauthorized'
        '500':
          $ref: '#/components/responses/AuthInternal'
  /auth/verify:
    get:
      tags:
      - Auth
      operationId: authVerifyEmail
      summary: Verify email by one-time token
      servers:
      - url: https://auth.cryptotax.example.com
        description: Auth service production
      - url: http://localhost:8082
        description: Local auth-svc
      parameters:
      - name: token
        in: query
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Email verified
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AckResponse'
        '401':
          $ref: '#/components/responses/AuthUnauthorized'
        '500':
          $ref: '#/components/responses/AuthInternal'
  /mexc/csv:
    post:
      tags:
      - Ledger
      operationId: uploadMexcCsv
      summary: Upload and parse MEXC CSV
      servers:
      - url: https://ledger.cryptotax.example.com
        description: Ledger service production
      - url: http://localhost:8086
        description: Local ledger-svc
      parameters:
      - name: X-User-Id
        in: header
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
              required:
              - file
      responses:
        '200':
          description: CSV parsed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParseSuccessResponse'
        '400':
          $ref: '#/components/responses/LedgerBadRequest'
        '403':
          $ref: '#/components/responses/LedgerForbidden'
        '404':
          $ref: '#/components/responses/LedgerNotFound'
        '422':
          $ref: '#/components/responses/LedgerUnprocessable'
        '500':
          $ref: '#/components/responses/LedgerInternal'
        '503':
          $ref: '#/components/responses/LedgerUnavailable'
  /exchanges/supported:
    get:
      tags:
      - Ledger
      operationId: listSupportedExchanges
      summary: List supported exchanges
      servers:
      - url: https://ledger.cryptotax.example.com
        description: Ledger service production
      - url: http://localhost:8086
        description: Local ledger-svc
      responses:
        '200':
          description: Supported exchange IDs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupportedExchangesResponse'
        '500':
          $ref: '#/components/responses/LedgerInternal'
  /fiat-currencies:
    get:
      tags:
      - Aggregation
      operationId: listSupportedFiatCurrencies
      summary: List supported fiat currencies
      description: Returns fiat currencies supported by aggregation/valuation pipeline.
      responses:
        '200':
          description: Supported currencies
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListSupportedFiatCurrenciesResponse'
        '400':
          $ref: '#/components/responses/GrpcInvalidArgument'
        '500':
          $ref: '#/components/responses/GrpcInternal'
  /transactions:
    get:
      tags:
      - Aggregation
      operationId: listTransactions
      summary: List aggregated transactions (cursor-based)
      parameters:
      - $ref: '#/components/parameters/PageSize'
      - $ref: '#/components/parameters/PageToken'
      - $ref: '#/components/parameters/DateFrom'
      - $ref: '#/components/parameters/DateTo'
      - $ref: '#/components/parameters/ImportIdQuery'
      - $ref: '#/components/parameters/SourceQuery'
      - $ref: '#/components/parameters/KindQuery'
      - $ref: '#/components/parameters/TargetFiat'
      responses:
        '200':
          description: Cursor-based list response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListTransactionsResponse'
        '400':
          $ref: '#/components/responses/GrpcInvalidArgument'
        '500':
          $ref: '#/components/responses/GrpcInternal'
  /settings:
    get:
      tags:
      - Aggregation
      operationId: getUserSettings
      summary: Get aggregation settings for the authenticated user
      responses:
        '200':
          description: User settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetUserSettingsResponse'
        '400':
          $ref: '#/components/responses/GrpcInvalidArgument'
        '500':
          $ref: '#/components/responses/GrpcInternal'
    put:
      tags:
      - Aggregation
      operationId: upsertUserSettings
      summary: Create or update aggregation settings for the authenticated user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpsertUserSettingsBody'
      responses:
        '200':
          description: Upserted user settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpsertUserSettingsResponse'
        '400':
          $ref: '#/components/responses/GrpcInvalidArgument'
        '500':
          $ref: '#/components/responses/GrpcInternal'
  /tax/profile:
    get:
      tags:
      - Tax
      operationId: getTaxProfile
      summary: Get tax profile
      responses:
        '200':
          description: Tax profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetTaxProfileResponse'
        '400':
          $ref: '#/components/responses/GrpcInvalidArgument'
        '404':
          $ref: '#/components/responses/GrpcNotFound'
        '500':
          $ref: '#/components/responses/GrpcInternal'
    put:
      tags:
      - Tax
      operationId: upsertTaxProfile
      summary: Create or update tax profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaxProfileInput'
      responses:
        '200':
          description: Upserted tax profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpsertTaxProfileResponse'
        '400':
          $ref: '#/components/responses/GrpcInvalidArgument'
        '500':
          $ref: '#/components/responses/GrpcInternal'
  /tax/reports:start:
    post:
      tags:
      - Tax
      operationId: startReport
      summary: Start tax report job
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartReportParams'
      responses:
        '200':
          description: Tax job created and queued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StartReportResponse'
        '400':
          $ref: '#/components/responses/GrpcInvalidArgument'
        '404':
          $ref: '#/components/responses/GrpcNotFound'
        '500':
          $ref: '#/components/responses/GrpcInternal'
  /tax/reports/{report_id}:
    get:
      tags:
      - Tax
      operationId: getReportStatus
      summary: Get tax report job status
      parameters:
      - $ref: '#/components/parameters/ReportIdPath'
      responses:
        '200':
          description: Tax report job
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetReportStatusResponse'
        '400':
          $ref: '#/components/responses/GrpcInvalidArgument'
        '404':
          $ref: '#/components/responses/GrpcNotFound'
        '500':
          $ref: '#/components/responses/GrpcInternal'
  /tax/reports:
    get:
      tags:
      - Tax
      operationId: listReports
      summary: List tax report jobs
      parameters:
      - $ref: '#/components/parameters/PaginationLimit'
      - $ref: '#/components/parameters/PaginationOffset'
      responses:
        '200':
          description: Paginated report jobs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListReportsResponse'
        '400':
          $ref: '#/components/responses/GrpcInvalidArgument'
        '500':
          $ref: '#/components/responses/GrpcInternal'
  /v1/price/transactions:valuate:
    post:
      tags:
      - PriceInternal
      operationId: internalPriceValuateTransactionsBatch
      summary: Valuate batch of transactions
      servers:
      - url: http://price-svc:8092
        description: In-cluster price-svc gateway
      - url: http://localhost:8092
        description: Local price-svc gateway
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PriceValuateTransactionsRequest'
      responses:
        '200':
          description: Valuated transactions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PriceValuateTransactionsResponse'
        '400':
          $ref: '#/components/responses/GrpcInvalidArgumentOrPrecondition'
        '503':
          $ref: '#/components/responses/GrpcUnavailable'
        '500':
          $ref: '#/components/responses/GrpcInternal'
  /v1/price/user-symbols:
    put:
      tags:
      - PriceInternal
      operationId: internalPriceUpsertUserSymbol
      summary: Create or update user symbol mapping
      servers:
      - url: http://price-svc:8092
        description: In-cluster price-svc gateway
      - url: http://localhost:8092
        description: Local price-svc gateway
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PriceUpsertUserSymbolRequest'
      responses:
        '200':
          description: Upsert completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PriceUpsertUserSymbolResponse'
        '400':
          $ref: '#/components/responses/GrpcInvalidArgumentOrPrecondition'
        '500':
          $ref: '#/components/responses/GrpcInternal'
  /v1/report/ndfl:render:
    post:
      tags:
      - ReportInternal
      operationId: internalReportRenderNDFL
      summary: Render 3-NDFL report XML and return object key
      servers:
      - url: http://report-svc:8099
        description: In-cluster report-svc gateway
      - url: http://localhost:8099
        description: Local report-svc gateway
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RenderNDFLRequest'
      responses:
        '200':
          description: Render result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RenderNDFLResponse'
        '400':
          $ref: '#/components/responses/GrpcInvalidArgumentOrPrecondition'
        '503':
          $ref: '#/components/responses/GrpcUnavailable'
        '500':
          $ref: '#/components/responses/GrpcInternal'
  /v1/transactions:
    get:
      tags:
      - AggregationInternal
      operationId: listTransactionsByRange
      summary: List aggregated transactions by UTC range
      description: 'Internal read endpoint for user transactions in time range `[from_utc,
        to_utc)`.

        Supports optional `target_fiat` revaluation without mutating stored read-model.

        '
      parameters:
      - $ref: '#/components/parameters/XUserId'
      - $ref: '#/components/parameters/FromUtc'
      - $ref: '#/components/parameters/ToUtc'
      - $ref: '#/components/parameters/PaginationLimitInternal'
      - $ref: '#/components/parameters/PaginationOffset'
      - $ref: '#/components/parameters/TargetFiat'
      responses:
        '200':
          description: Paginated transactions in range
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListTransactionsByRangeResponse'
        '400':
          $ref: '#/components/responses/GrpcInvalidArgumentOrPrecondition'
        '503':
          $ref: '#/components/responses/GrpcUnavailable'
        '500':
          $ref: '#/components/responses/GrpcInternal'
  /v1/imports/{import_id}/transactions:
    get:
      tags:
      - LedgerInternal
      operationId: ledgerListImportTransactions
      summary: List ledger import transactions
      servers:
      - url: http://ledger-svc:8086
        description: In-cluster ledger-svc
      - url: http://localhost:8086
        description: Local ledger-svc
      parameters:
      - $ref: '#/components/parameters/XUserId'
      - $ref: '#/components/parameters/ImportIdPath'
      responses:
        '200':
          description: Transactions for import
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  additionalProperties: true
        '400':
          $ref: '#/components/responses/LedgerImportBadRequest'
        '403':
          $ref: '#/components/responses/LedgerImportForbidden'
        '404':
          $ref: '#/components/responses/LedgerImportNotFound'
        '500':
          $ref: '#/components/responses/LedgerImportInternal'
        '503':
          $ref: '#/components/responses/LedgerUnavailable'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    userHeader:
      type: apiKey
      in: header
      name: X-User-Id
  parameters:
    ImportIdPath:
      name: import_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ReportIdPath:
      name: report_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PaginationLimit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 200
    PaginationOffset:
      name: offset
      in: query
      required: false
      schema:
        type: integer
        format: int32
        minimum: 0
    PageSize:
      name: page_size
      in: query
      required: false
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 100
    PageToken:
      name: page_token
      in: query
      required: false
      schema:
        type: string
    DateFrom:
      name: date_from
      in: query
      required: false
      schema:
        type: string
        format: date-time
      description: Inclusive UTC lower bound.
    DateTo:
      name: date_to
      in: query
      required: false
      schema:
        type: string
        format: date-time
      description: Exclusive UTC upper bound.
    ImportIdQuery:
      name: import_id
      in: query
      required: false
      schema:
        type: string
        format: uuid
    SourceQuery:
      name: source
      in: query
      required: false
      schema:
        type: string
    KindQuery:
      name: kind
      in: query
      required: false
      schema:
        type: string
    TargetFiat:
      name: target_fiat
      in: query
      required: false
      schema:
        type: string
      description: Optional fiat override for on-the-fly revaluation (e.g. RUB, USD,
        KZT).
    PaginationLimitInternal:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 10000
    FromUtc:
      name: from_utc
      in: query
      required: true
      schema:
        type: string
        format: date-time
      description: Inclusive UTC lower bound.
    ToUtc:
      name: to_utc
      in: query
      required: true
      schema:
        type: string
        format: date-time
      description: Exclusive UTC upper bound.
    XUserId:
      name: X-User-Id
      in: header
      required: true
      schema:
        type: string
        format: uuid
  responses:
    Error:
      description: Generic grpc-gateway error response.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    GrpcInvalidArgument:
      description: Invalid request data (gRPC `InvalidArgument`, code `3`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    GrpcFailedPrecondition:
      description: Request is valid but data is not ready (gRPC `FailedPrecondition`,
        code `9`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    GrpcNotFound:
      description: Resource not found (gRPC `NotFound`, code `5`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    GrpcConflict:
      description: Conflict/duplicate (gRPC `AlreadyExists` or `Aborted`, code `6`/`10`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    GrpcUnavailable:
      description: Temporary upstream/dependency outage (gRPC `Unavailable`, code
        `14`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    GrpcInternal:
      description: Internal server failure (gRPC `Internal`, code `13`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    AuthUnauthorized:
      description: Unauthorized (`TokenInvalid`, `TokenExpired`, `InvalidCredentials`,
        ...).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AuthErrorResponse'
    AuthForbidden:
      description: Forbidden (`UserNotVerified`, `UserBlocked`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AuthErrorResponse'
    AuthConflict:
      description: Conflict (`EmailAlreadyRegistered`, ...).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AuthErrorResponse'
    AuthUnprocessable:
      description: Validation error (`EmailInvalid`, `PasswordWeak`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AuthErrorResponse'
    AuthBadGateway:
      description: Upstream failure (`RegistrationFailed`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AuthErrorResponse'
    AuthUnavailable:
      description: Temporary outage (`EmailSendFailed`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AuthErrorResponse'
    AuthInternal:
      description: Internal server error (`Storage`, `Internal`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AuthErrorResponse'
    LedgerBadRequest:
      description: Bad request (missing file / malformed multipart / CSV format).
      content:
        application/json:
          schema:
            oneOf:
            - $ref: '#/components/schemas/SimpleErrorResponse'
            - $ref: '#/components/schemas/LedgerErrorResponse'
    LedgerForbidden:
      description: Missing/invalid user header or permission denied.
      content:
        application/json:
          schema:
            oneOf:
            - $ref: '#/components/schemas/SimpleErrorResponse'
            - $ref: '#/components/schemas/LedgerErrorResponse'
    LedgerNotFound:
      description: Exchange parser not configured.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SimpleErrorResponse'
    LedgerUnprocessable:
      description: Domain validation/consistency error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/LedgerErrorResponse'
    LedgerInternal:
      description: Internal server error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/LedgerErrorResponse'
    LedgerUnavailable:
      description: Dependency unavailable.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/LedgerErrorResponse'
    LedgerImportBadRequest:
      description: Bad request (invalid UUID in path/header params).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SimpleErrorResponse'
    LedgerImportForbidden:
      description: Missing or invalid user header (`X-User-Id`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SimpleErrorResponse'
    LedgerImportInternal:
      description: Internal server error from ledger-svc.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/LedgerErrorResponse'
    LedgerImportNotFound:
      description: Import not found (or belongs to another user).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SimpleErrorResponse'
    GrpcInvalidArgumentOrPrecondition:
      description: Invalid input or unresolved dependency data (gRPC `InvalidArgument`/`FailedPrecondition`,
        code `3`/`9`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    ErrorResponse:
      type: object
      description: Standard grpc-gateway error envelope.
      properties:
        code:
          type: integer
          format: int32
          description: gRPC status code (`3`, `5`, `9`, `13`, `14`, ...).
        message:
          type: string
          description: Human-readable error message.
        details:
          type: array
          description: Optional gRPC rich error details.
          items:
            oneOf:
            - $ref: '#/components/schemas/GrpcErrorInfoDetail'
            - $ref: '#/components/schemas/GrpcBadRequestDetail'
            - $ref: '#/components/schemas/GrpcResourceInfoDetail'
            - $ref: '#/components/schemas/GrpcAnyDetail'
      required:
      - code
      - message
    GrpcErrorInfoDetail:
      type: object
      properties:
        '@type':
          type: string
