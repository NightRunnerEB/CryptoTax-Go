receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
  resource:
    attributes:
      - action: insert
        key: deployment.environment
        value: ${DEPLOYMENT_ENVIRONMENT}
  memory_limiter:
    limit_mib: 512
    spike_limit_mib: 128
    check_interval: 5s
  attributes/loki:
    actions:
      - action: insert
        key: loki.attribute.labels
        value: rpc.method,rpc.service,rpc.response.status_code
  resource/loki:
    attributes:
      - action: insert
        key: loki.resource.labels
        value: service.name,service.version,deployment.environment

exporters:
  prometheus:
    endpoint: "0.0.0.0:9464"
    resource_to_telemetry_conversion:
      enabled: true
  loki:
    endpoint: "http://loki:3100/loki/api/v1/push"
    default_labels_enabled:
      exporter: false

service:
  pipelines:
    metrics:
      receivers: [otlp]
      processors: [resource, batch]
      exporters: [prometheus]
    logs:
      receivers: [otlp]
      processors: [resource, attributes/loki, resource/loki, batch]
      exporters: [loki]
