groups:
  - name: price-svc.grpc
    rules:
      - alert: PriceSvcHighErrorRate
        expr: |
          sum(rate(rpc_server_call_duration_count{rpc_response_status_code!="OK"}[5m]))
          /
          sum(rate(rpc_server_call_duration_count[5m]))
          > 0.01
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "gRPC error rate > 1% (price-svc)"
          description: "Error rate above 1% over 10 minutes."

      - alert: PriceSvcHighP99Latency
        expr: |
          histogram_quantile(
            0.99,
            sum(rate(rpc_server_call_duration_bucket[5m])) by (le)
          ) > 1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "p99 latency > 1s (price-svc)"
          description: "p99 latency exceeded 1s over 10 minutes."

      - alert: PriceSvcNoMetrics
        expr: |
          absent(rpc_server_call_duration_count)
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "price-svc metrics missing"
          description: "No gRPC metrics observed for 5 minutes."

      - alert: PriceSvcRestarted
        expr: |
          resets(rpc_server_call_duration_count[10m]) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "price-svc restarted"
          description: "gRPC metric counters reset in the last 10 minutes."
