app:
  name: "aggregation-svc"
  env: "dev"

log:
  level: "debug"

otel:
  endpoint: "localhost:4317"
  insecure: true
  metrics_export_interval: 10s
  runtime_read_mem_stats_interval: 10s

grpc:
  addr: "0.0.0.0:8094"

http:
  addr: "0.0.0.0:8095"
  shutdown_timeout: 5s

postgres:
  pool_max: 10
  conn_attempts: 3
  conn_timeout: 2s
  attempt_timeout: 5s

redis:
  pool_max: 4
  jitter: 120s

ledger:
  base_url: "0.0.0.0:8086"
  timeout: 10s

price:
  addr: "0.0.0.0:8093"
  timeout: 10s
  batch_size: 10000

rabbitmq:
  url: "amqp://guest:guest@localhost:5672/"
  exchange: "cryptotax"
  queue: "aggregation.import.completed"
  queue_durable: true
  routing_key: "import.completed"
  consumer_name: "aggregation-import-completed-consumer"
  prefetch: 10
  concurrency: 1
  reconnect_interval: 2s

aggregation:
  default_fiat_currency: "rub"
  default_timezone: "Europe/Moscow"
  import_lock_ttl: 10m
