app:
  name: "tax-svc"
  env: "dev"

log:
  level: "debug"

otel:
  endpoint: "localhost:4317"
  insecure: true
  metrics_export_interval: 10s
  runtime_read_mem_stats_interval: 10s

grpc:
  addr: "0.0.0.0:8096"

http:
  addr: "0.0.0.0:8097"
  shutdown_timeout: 5s

postgres:
  max_conns: 10
  conn_timeout: 2s
  attempt_timeout: 5s
  conn_attempts: 3

aggregation:
  addr: "127.0.0.1:8094"
  timeout: 10s

report:
  addr: "127.0.0.1:8098"
  timeout: 10s

minio:
  endpoint: "127.0.0.1:9000"
  bucket: "tax-reports"
  use_ssl: false
  presign_ttl: 15m
  request_timeout: 10s
  retry_max: 3
  retry_base_delay: 200ms
  retry_max_delay: 2s

worker:
  poll_interval: 5s
  idle_sleep: 500ms
  retry_max_attempts: 3
  retry_base_delay: 10s
  retry_max_delay: 2m
